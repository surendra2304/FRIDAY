services:
  - type: web
    name: friday-core
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      # Primary LLM API Key (prompts user in Render Dashboard)
      - key: FRIDAY_GEMINI_API_KEY
        sync: false
      - key: FRIDAY_LLM_API_KEY
        sync: false
      # Universe Inter-Agent Auth Key
      - key: FRIDAY_UNIVERSE_API_KEY
        value: "friday_universe_api"
      - key: FRIDAY_API_KEY
        value: "friday_universe_api"
      # Specialist Agent Endpoints (Clean Canonical Names)
      - key: FRIDAY_CORTEX_URL
        value: "none"
      - key: FRIDAY_FORGE_URL
        value: "none"
      - key: FRIDAY_FUTURIS_URL
        value: "none"
      - key: FRIDAY_INFERENCE_URL
        value: "none"
      - key: FRIDAY_INTELX_URL
        value: "none"
      - key: FRIDAY_MEMORA_URL
        value: "none"
      - key: FRIDAY_SENTINEL_URL
        value: "none"
      - key: FRIDAY_STRATEX_URL
        value: "none"
      # Specialist Agent API Keys
      - key: FRIDAY_CORTEX_API_KEY
        value: "friday_universe_api"
      - key: FRIDAY_FORGE_API_KEY
        value: "friday_universe_api"
      - key: FRIDAY_FUTURIS_API_KEY
        value: "friday_universe_api"
      - key: FRIDAY_INFERENCE_API_KEY
        value: "friday_universe_api"
      - key: FRIDAY_INTELX_API_KEY
        value: "friday_universe_api"
      - key: FRIDAY_MEMORA_API_KEY
        value: "friday_universe_api"
      - key: FRIDAY_SENTINEL_API_KEY
        value: "friday_universe_api"
      - key: FRIDAY_STRATEX_API_KEY
        value: "friday_universe_api"
      # Optional external services
      - key: FRIDAY_GROQ_API_KEY
        value: "none"
      - key: FRIDAY_MISTRAL_API_KEY
        value: "none"
      - key: FRIDAY_OPENROUTER_API_KEY
        value: "none"
      - key: FRIDAY_GITHUB_TOKEN
        value: "none"
      - key: FRIDAY_EMAIL_APP_PASSWORD
        value: "none"
      - key: FRIDAY_IOT_HUB_URL
        value: "none"
      - key: FRIDAY_IOT_HUB_TOKEN
        value: "none"
      - key: FRIDAY_CALENDAR_ICS_URL
        value: "none"
      - key: FRIDAY_LLM_MAX_TOKENS
        value: "4096"
