[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-agent"
version = "0.1.0"
description = "FRIDAY — Fully Responsive Intelligent Digital Assistant for You"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "FRIDAY Project Team" }
]
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "duckduckgo-search>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.0.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "resemblyzer>=0.1.3",
    # Windows: webrtcvad (resemblyzer dep) has no MSVC-free sdist build;
    # webrtcvad-wheels provides the prebuilt drop-in.
    "webrtcvad-wheels>=2.0.14rc1; sys_platform == 'win32'",
    "chromadb>=0.4.0",
    "PyGithub>=2.0.0",
    "psutil>=5.9.0",
    "icalendar>=5.0.0",
    "recurring-ical-events>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
friday = "friday.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not live and not hardware'"
markers = [
    "unit: Unit tests verifying isolated components and data models",
    "integration: Multi-component agent and memory integration tests",
    "simulation: In-memory and offline simulated multi-stage workflow tests",
    "security: Authentication, authorization, and secret protection tests",
    "performance: Benchmarks, latency, RSS, and CPU utilization tests",
    "acceptance: End-to-end goal understanding and agent acceptance tests",
    "live: Real external Google Gemini API tests (opt-in only via pytest -m live)",
    "hardware: Real physical microphone, speaker, and display hardware tests (opt-in only via pytest -m hardware)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",   # line length
    "E722",   # bare except
    "E402",   # module import not at top
    "E741",   # ambiguous variable name
    "F401",   # unused imports
    "F841",   # unused local variables
    "W291",   # trailing whitespace
    "W292",   # no newline at end of file
    "W293",   # blank line whitespace
    "B008",   # function call in default argument
    "B904",   # raise ... from err
    "SIM105", # contextlib.suppress
    "SIM115", # context manager for open
    "SIM108", # ternary operator
    "SIM117", # nested with
    "UP007",  # Optional / Union syntax
    "UP006",  # typing syntax
    "UP035",  # typing deprecated
    "UP017",  # datetime.UTC
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = [
    "attr-defined",
    "assignment",
    "no-untyped-def",
    "union-attr",
    "call-arg",
    "arg-type",
    "import-untyped",
    "override",
    "operator",
    "no-untyped-call",
    "type-arg",
    "var-annotated",
    "dict-item",
    "no-redef",
    "misc",
    "index",
    "truthy-function",
    "return-value",
]
