[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-agent"
version = "0.1.0"
description = "FRIDAY — Fully Responsive Intelligent Digital Assistant for You"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "FRIDAY Project Team" }
]
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
friday = "friday.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not live and not hardware'"
markers = [
    "unit: Unit tests verifying isolated components and data models",
    "integration: Multi-component agent and memory integration tests",
    "simulation: In-memory and offline simulated multi-stage workflow tests",
    "security: Authentication, authorization, and secret protection tests",
    "performance: Benchmarks, latency, RSS, and CPU utilization tests",
    "acceptance: End-to-end goal understanding and agent acceptance tests",
    "live: Real external Google Gemini API tests (opt-in only via pytest -m live)",
    "hardware: Real physical microphone, speaker, and display hardware tests (opt-in only via pytest -m hardware)",
]
