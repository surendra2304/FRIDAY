name: Task 1 — FRIDAY, Inference, Memora
run-name: "Task 1 — FRIDAY, Inference, Memora • scheduled engineering"
on:
  schedule:
    # Asia/Kolkata time, expressed in UTC because GitHub scheduled workflows use UTC.
    - cron: '30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: friday-universe-continuous-task-1
  cancel-in-progress: false
jobs:
  engineer:
    name: Implement, test, hand off, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout orchestration and task instructions
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify coding and cross-repository write credentials
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CONTINUOUS_ENGINEERING_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error title=Missing coding provider credential::Configure the OPENAI_API_KEY Actions secret in surendra2304/FRIDAY. The ChatGPT subscription is not itself an API key."
            exit 1
          fi
          if [[ -z "$CONTINUOUS_ENGINEERING_TOKEN" ]]; then
            echo "::error title=Missing cross-repository write credential::Configure CONTINUOUS_ENGINEERING_TOKEN with Contents:write and Pull requests:write for all ten assigned repositories."
            exit 1
          fi
          echo "Required secret names are present; values will not be printed."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node for Codex CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: npm install --global @openai/codex

      - name: Prepare isolated workspaces and project dependencies
        run: python scripts/continuous_engineering_runner.py prepare --task 1

      - name: Run continuous coding passes (minimum 31 active minutes)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/continuous_engineering_runner.py run --task 1

      - name: Publish code branches, PRs, and persistent handoff
        env:
          CONTINUOUS_ENGINEERING_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN }}
        run: python scripts/continuous_engineering_runner.py publish --task 1

      - name: Upload run logs and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-universe-task-1-run-${{ github.run_id }}
          path: ${{ runner.temp }}/friday-ce-${{ github.run_id }}-${{ github.run_attempt }}-task-1/
          if-no-files-found: ignore
          retention-days: 14
