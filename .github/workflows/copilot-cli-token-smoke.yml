name: Copilot CLI Token Smoke Test
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-cli-token-smoke.yml
permissions:
  contents: read
  copilot-requests: write
jobs:
  copilot-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Copilot CLI
        run: npm install --global @github/copilot
      - name: Authenticate using the scoped Actions token
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copilot -p "Reply exactly with the word READY. Do not use tools." --no-ask-user --secret-env-vars COPILOT_GITHUB_TOKEN -s | tee response.txt
          grep -q READY response.txt
