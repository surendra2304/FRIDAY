name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff
        run: python -m ruff check src/ tests/

      - name: Run mypy
        run: python -m mypy src/

      - name: Run portable pytest suite
        if: matrix.os == 'ubuntu-latest'
        run: python -m pytest -m "not live and not hardware and not windows"

      - name: Run Windows-specific pytest suite
        if: matrix.os == 'windows-latest'
        run: python -m pytest -m "windows and not live and not hardware"

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        if: matrix.os == 'ubuntu-latest'
