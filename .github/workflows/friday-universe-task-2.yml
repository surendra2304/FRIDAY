name: Task 2 — Stratex, IntelX, Futuris
run-name: "Task 2 — Stratex, IntelX, Futuris • scheduled engineering"
on:
  schedule:
    # Asia/Kolkata time, expressed in UTC because GitHub scheduled workflows use UTC.
    - cron: '50 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: friday-universe-continuous-task-2
  cancel-in-progress: false
jobs:
  engineer:
    name: Implement, test, hand off, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout orchestration and task instructions
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Verify coding and cross-repository write credentials
        id: credentials
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_PROVIDER: ${{ secrets.OPENAI_API_KEY && 'openai' || 'openrouter' }}
          CODE_AGENT: ${{ (secrets.OPENAI_API_KEY || secrets.OPENROUTER_API_KEY) && 'codex' || secrets.COPILOT_GITHUB_TOKEN && 'copilot' || 'missing' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL || 'gpt-6-astra' }}
          CONTINUOUS_ENGINEERING_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN || secrets.CROSS_REPO_GITHUB_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.FRIDAY_GITHUB_TOKEN }}
        run: |
          if [[ "$CODE_AGENT" == "codex" && -z "$OPENAI_API_KEY" ]]; then
            echo "::error title=Missing coding provider credential::Configure OPENAI_API_KEY or OPENROUTER_API_KEY in surendra2304/FRIDAY Actions secrets."
            exit 1
          fi
          if [[ "$CODE_AGENT" == "copilot" && -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error title=Missing coding provider credential::Configure an eligible fine-grained COPILOT_GITHUB_TOKEN with Copilot Requests permission, or provide OPENAI_API_KEY / OPENROUTER_API_KEY."
            exit 1
          fi
          if [[ "$CODE_AGENT" == "missing" ]]; then
            echo "::error title=Missing coding provider credential::Configure OPENAI_API_KEY, OPENROUTER_API_KEY, or COPILOT_GITHUB_TOKEN."
            exit 1
          fi
          if [[ -z "$CONTINUOUS_ENGINEERING_TOKEN" ]]; then
            echo "::error title=Missing cross-repository write credential::Configure CONTINUOUS_ENGINEERING_TOKEN, CROSS_REPO_GITHUB_TOKEN, GITHUB_PAT, GH_PAT, PERSONAL_ACCESS_TOKEN, or FRIDAY_GITHUB_TOKEN with Contents:write and Pull requests:write for all ten assigned repositories."
            exit 1
          fi
          echo "Required secret names are present; values will not be printed."

      - name: Cache pip downloads for target repositories
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-friday-ce-pip-v1
          restore-keys: |
            ${{ runner.os }}-friday-ce-pip-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node for Codex CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Codex CLI
        run: npm install --global @openai/codex @github/copilot

      - name: Prepare isolated workspaces and project dependencies
        id: prepare
        run: python scripts/continuous_engineering_runner.py prepare --task 2

      - name: Run continuous coding passes (minimum 31 active minutes)
        id: code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CODEX_PROVIDER: ${{ secrets.OPENAI_API_KEY && 'openai' || 'openrouter' }}
          CODE_AGENT: ${{ (secrets.OPENAI_API_KEY || secrets.OPENROUTER_API_KEY) && 'codex' || secrets.COPILOT_GITHUB_TOKEN && 'copilot' || 'missing' }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL || 'gpt-6-astra' }}
        run: python scripts/continuous_engineering_runner.py run --task 2

      - name: Publish code branches, PRs, and persistent handoff
        if: always() && steps.credentials.outcome == 'success' && steps.prepare.outcome == 'success'
        env:
          CONTINUOUS_ENGINEERING_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN || secrets.CROSS_REPO_GITHUB_TOKEN || secrets.GITHUB_PAT || secrets.GH_PAT || secrets.PERSONAL_ACCESS_TOKEN || secrets.FRIDAY_GITHUB_TOKEN }}
        run: python scripts/continuous_engineering_runner.py publish --task 2

      - name: Upload run logs and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-universe-task-2-run-${{ github.run_id }}
          path: ${{ runner.temp }}/friday-ce-${{ github.run_id }}-${{ github.run_attempt }}-task-2/
          if-no-files-found: ignore
          retention-days: 14
