name: GitHub Models Token Smoke Test
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-models-token-smoke.yml
permissions:
  contents: read
  models: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      models: read
    steps:
      - name: Call GitHub Models using the built-in Actions token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error https://models.github.ai/inference/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d '{"model":"openai/gpt-4.1","messages":[{"role":"user","content":"Reply with exactly READY"}],"max_tokens":20}')
          echo "$response" | jq -e '.choices[0].message.content | strings | contains("READY")' || { echo "$response"; exit 1; }
