name: FRIDAY Universe Task 3 — VyralX, Forge, Sentinel, Cortex
run-name: "Task 3 — Content automation, engineering and defense"
on:
  schedule:
    # 00:40 Asia/Kolkata (UTC+05:30)
    - cron: '10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  copilot-requests: write
concurrency:
  group: friday-universe-task-3
  cancel-in-progress: false
jobs:
  engineer:
    name: Implement, test, checkpoint and publish
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout FRIDAY orchestration repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install autonomous coding CLI
        run: npm install --global @openai/codex
      - name: Validate cross-repository publishing credential
        env:
          CONTINUOUS_ENGINEERING_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN }}
        run: |
          test -n "$CONTINUOUS_ENGINEERING_TOKEN" || { echo "::error::Add CONTINUOUS_ENGINEERING_TOKEN with contents write and pull-request write on all ten repositories."; exit 1; }
      - name: Prepare isolated repositories and restore handoff
        env:
          CONTINUOUS_ENGINEERING_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN }}
        run: python scripts/continuous_engineering_runner.py prepare --task 3
      - name: Execute code changes and tests for at least 31 active minutes
        id: coding
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}
          CODE_AGENT: copilot
          CONTINUOUS_ENGINEERING_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN }}
        run: python scripts/continuous_engineering_runner.py run --task 3
      - name: Publish code PRs and persist the next-run handoff
        if: always() && steps.coding.outcome != 'skipped'
        env:
          CONTINUOUS_ENGINEERING_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN }}
          GH_TOKEN: ${{ secrets.CONTINUOUS_ENGINEERING_TOKEN }}
        run: python scripts/continuous_engineering_runner.py publish --task 3
